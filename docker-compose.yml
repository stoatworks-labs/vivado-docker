# docker compose for the Vivado build environment.
#
#   docker compose build                              # build the prereq image
#   docker compose run --rm vivado run-installer.sh   # install Vivado into XILINX_DIR
#   docker compose run --rm vivado vivado -version    # sanity check
#   docker compose run --rm vivado bash               # interactive shell
#
# For a persistent container (recommended on Unraid), also apply the override:
#   docker compose -f docker-compose.yml -f docker-compose.unraid.yml up -d
#   docker exec -it vivado bash -lc "vivado -version"
#
# Must run on an x86-64 Docker host (Vivado is x86-only).

services:
  vivado:
    build:
      context: .
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: vivado-docker:latest
    platform: linux/amd64
    shm_size: "2gb"
    environment:
      XILINXD_LICENSE_FILE: ${XILINXD_LICENSE_FILE:-}
    volumes:
      # AMD installer you downloaded (gitignored). Drop the .bin/.tar.gz here.
      - ./installer:/installer
      # Persistent Vivado install as a HOST-PATH BIND MOUNT (not a named volume),
      # so the ~100GB lives on real storage — critical on Unraid, where a named
      # volume would overflow docker.img. Point XILINX_DIR at a cache-pool path.
      - ${XILINX_DIR:-./_xilinx}:/opt/Xilinx
      # Optional node-locked license(s).
      - ./licenses:/licenses
      # Your project. Point PROJECT_DIR at the atem-av-fw checkout on the host.
      - ${PROJECT_DIR:-../atem-av-fw}:/workspace
    working_dir: /workspace
