name: build-image

# Build the prerequisite image (no Vivado inside) and publish it to GHCR so hosts
# like Unraid can pull it straight from the Docker UI instead of building locally.
on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - scripts/**
      - install/run-installer.sh
      - .github/workflows/build-image.yml
  workflow_dispatch:

concurrency:
  group: build-image
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (amd64 — Vivado is x86-only)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          # Build the image as the Unraid nobody:users ids so mounted appdata files
          # aren't root-owned. Override with a local build if you need other ids.
          build-args: |
            UID=99
            GID=100
          tags: ghcr.io/${{ github.repository_owner }}/vivado-docker:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
